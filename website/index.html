    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ChildCare",
        "name": "Little Genius Island",
        "description": "Bilingual Montessori daycare in Newmarket, Ontario, with piano lessons and private tutoring.",
        "url": "https://littlegeniusisland.ca/",
        "telephone": "905 977 1151",
        "email": "info@littlegeniusisland.ca",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "78 Main St S",
          "addressLocality": "Newmarket",
          "addressRegion": "ON",
          "postalCode": "L3Y 3Y6",
          "addressCountry": "CA"
        },
        "openingHoursSpecification": [
          { "@type": "OpeningHoursSpecification", "dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday","Friday"], "opens": "07:00", "closes": "18:00" }
        ]
      }
    </script>

  <body>
        <form name="daycare-signup" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="bot-field" /><input name="subject" /><input name="service" /><input name="parent_name" /><input name="email" /><input name="phone" /><input name="preferred_contact" /><input name="children_count" /><textarea name="children"></textarea><textarea name="notes"></textarea>
    </form>
    <form name="piano-signup" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="bot-field" /><input name="subject" /><input name="service" /><input name="parent_name" /><input name="email" /><input name="phone" /><input name="preferred_contact" /><input name="children_count" /><textarea name="children"></textarea><textarea name="notes"></textarea>
    </form>
    <form name="tutoring-signup" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="bot-field" /><input name="subject" /><input name="service" /><input name="parent_name" /><input name="email" /><input name="phone" /><input name="preferred_contact" /><input name="children_count" /><textarea name="children"></textarea><textarea name="notes"></textarea>
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
